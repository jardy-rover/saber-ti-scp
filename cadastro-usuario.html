<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuário</title>

  <link rel="stylesheet" href="css/accion.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>

  <main class="pagina" style="max-width: 640px; margin: var(--espaco-8) auto;">

    <header class="page-header" style="justify-content: center; text-align: center; flex-direction: column;">
      <div class="page-header-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z" />
        </svg>
      </div>
      <div>
        <h1>Cadastro de Usuário</h1>
        <p>Preencha os dados abaixo para criar sua credencial de acesso ao sistema</p>
      </div>
    </header>

    <form id="formUsuario">

      <article class="card" style="margin-bottom: var(--espaco-6);">
        <div class="card-header">
          <span class="card-header-title">DADOS PESSOAIS</span>
          <span class="card-header-badge">Passo 1</span>
        </div>

        <div class="card-body">
          <div class="caixa-dados form-grid">
            
            <div class="campo span-2">
              <label for="nomeCompleto">Nome Completo <span class="obrigatorio">*</span></label>
              <input type="text" id="nomeCompleto" maxlength="100" placeholder="Digite o nome completo" required>
            </div>

            <div class="campo">
              <label for="email">E-mail <span class="obrigatorio">*</span></label>
              <input type="email" id="email" placeholder="exemplo@email.com" required>
            </div>

            <div class="campo">
              <label for="cpf">CPF <span class="obrigatorio">*</span></label>
              <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" required>
            </div>

            <div class="campo">
              <label for="telefone">Telefone <span class="obrigatorio">*</span></label>
              <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>
            </div>

            <div class="campo">
              <label for="cargo">Cargo <span class="obrigatorio">*</span></label>
              <div class="campo-select-wrap">
                <select id="cargo" required>
                  <option value="" disabled selected>Selecione o seu cargo</option>
                  <option value="ADMINISTRADOR">ADMINISTRADOR</option>
                  <option value="GERENTE">GERENTE</option>
                  <option value="OPERADOR">OPERADOR</option>
                  <option value="VENDEDOR">VENDEDOR</option>
                </select>
              </div>
            </div>

            <div class="acoes" style="display: none;">
              <button type="reset" class="btn btn-secundario">
                Limpar
              </button>
              <button type="button" id="btnAvancar" class="btn btn-primario">
                <span>Avançar</span>
              </button>
            </div>

          </div>
        </div>
      </article>

      <article class="card">
        <div class="card-header">
          <span class="card-header-title">SEGURANÇA DA CONTA</span>
          <span class="card-header-badge">Passo 2</span>
        </div>

        <div class="card-body">
          <div class="caixa-senha form-grid">
            
            <div class="campo">
              <label for="senha">Senha <span class="obrigatorio">*</span></label>
              <input type="password" id="senha" placeholder="Digite a senha" required>
            </div>

            <div class="campo">
              <label for="confirmarSenha">Confirmar Senha <span class="obrigatorio">*</span></label>
              <input type="password" id="confirmarSenha" placeholder="Confirme a sua senha" required>
            </div>

            <div class="acoes">
              <button type="submit" id="btnCadastrar" class="btn btn-primario">
                <span>Concluir registro</span>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                  <path d="M20 6L9 17l-5-5" />
                </svg>
              </button>
            </div>

          </div>
        </div>
      </article>

    </form>

    <div id="mensagem" class="mensagem-feedback" style="margin-top: var(--espaco-4);"></div>

    <p style="text-align: center; font-size: var(--tamanho-sm); margin-top: var(--espaco-5);">
      Já possui uma conta de acesso? <a href="/index.html" style="color: var(--texto-link); font-weight: 600; text-decoration: none;">Faça o login aqui!</a>
    </p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="scripts/cadastro-usuario.js"></script>
  <script src="scripts/global.js"></script>

</body>
</html>
